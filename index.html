<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembayaran Berhasil - Soekarno Run 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#d90429,#6a040f);
color:white;
overflow:hidden;
text-align:center;
padding:20px;
}
.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:40px;
border-radius:30px;
max-width:700px;
width:100%;
box-shadow:0 0 40px rgba(255,255,255,.15);
}
.check{
font-size:120px;
animation:pop .8s ease;
}
h1{
font-size:clamp(2rem,5vw,3.5rem);
margin-bottom:10px;
}
p{
font-size:1.1rem;
margin:10px 0;
}
.btn{
display:inline-block;
margin-top:25px;
padding:15px 30px;
border-radius:50px;
background:white;
color:#b00020;
text-decoration:none;
font-weight:bold;
}
.confetti{
position:fixed;
top:-20px;
width:10px;
height:10px;
animation:fall linear forwards;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}
@keyframes pop{
0%{transform:scale(.2);opacity:0}
100%{transform:scale(1);opacity:1}
}
</style>
</head>
<body>

<div class="card">
<div class="check">✅</div>

<h1>PEMBAYARAN BERHASIL</h1>

<p>Terima kasih telah mendaftar.</p>

<p><b>10K Central Celebes Soekarno Run 2026</b></p>

<p>Pendaftaran Anda telah diterima dan sedang diproses oleh panitia.</p>

<p>Harap simpan bukti pembayaran dan data pendaftaran Anda.</p>

<a class="btn" href="https://onlinetiketdigital.github.io/SOEKARNO-RUN/">
KEMBALI KE BERANDA
</a>
</div>

<script>
for(let i=0;i<120;i++){
let c=document.createElement('div');
c.className='confetti';
c.style.left=Math.random()*100+'vw';
c.style.background='hsl('+Math.random()*360+',100%,60%)';
c.style.animationDuration=(3+Math.random()*5)+'s';
c.style.opacity=Math.random();
document.body.appendChild(c);
}
</script>

</body>
</html>
